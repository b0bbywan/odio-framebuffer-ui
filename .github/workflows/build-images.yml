name: Build builder images

on:
  push:
    branches: [main]
    paths:
      - 'docker/builder.Dockerfile'
      - '.github/workflows/build-images.yml'
  workflow_dispatch:
  schedule:
    # Refresh monthly to pick up base image security updates
    - cron: '0 4 1 * *'

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    name: Build ${{ matrix.arch }} image
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      # No armhf: Raspberry Pi OS armhf (Raspbian, armv6) ships no QtWebEngine
      # binaries at all, so there is nothing to link against. Pi OS arm64 uses
      # Debian's own arm64 archive, hence plain debian:trixie for both.
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: docker
          file: docker/builder.Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            BASE_IMAGE=debian:trixie
          tags: ghcr.io/${{ github.repository_owner }}/odio-framebuffer-ui-builder:${{ matrix.arch }}
          push: true
          cache-from: type=gha,scope=builder-${{ matrix.arch }}
          cache-to: type=gha,scope=builder-${{ matrix.arch }},mode=max
