name: Build

on:
  push:
    tags: ['v*']
    # Branch pushes exercise the pipeline; the release job is tag-only.
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  # Once for both arches, so they cannot disagree on the version.
  resolve:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve
        id: pick
        run: |
          set -euo pipefail
          # The changelog is the source of truth for a release; a release tag has
          # to name it, so a stale tag cannot publish something else.
          BASE="$(head -1 debian/changelog | sed -E 's/^[^(]*\(([^)]*)\).*/\1/')"

          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            case "${TAG}" in
              v*-rc*|v*-beta*|v*-alpha*)
                # A prerelease names its own version, changelog or not.
                UPSTREAM="${TAG#v}"
                # '~' sorts below nothing, so it stays below the release and
                # apt upgrades off it.
                VERSION="${UPSTREAM%%-*}~${UPSTREAM#*-}" ;;
              "v${BASE}")                 VERSION="${BASE}" ;;
              *)
                echo "::error::release tag ${TAG} does not match debian/changelog (${BASE}); expected v${BASE} or a prerelease like vX.Y.Z-rcN"
                exit 1 ;;
            esac
          else
            # Nothing is published off a branch; 0.0.0 sorts below every real
            # release in case one escapes as an artifact.
            VERSION="0.0.0+ci.${GITHUB_SHA:0:7}"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "${{ github.ref_name }} → deb version ${VERSION}"

  build:
    name: Build ${{ matrix.arch }}
    needs: resolve
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      # No armhf — see build-images.yml.
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Copied out of the mount: dpkg-buildpackage writes to the parent.
      - name: Build .deb
        run: |
          mkdir -p dist
          docker run --rm \
            --platform ${{ matrix.platform }} \
            -v "$PWD":/workspace \
            -e VERSION='${{ needs.resolve.outputs.version }}' \
            -e GITHUB_SHA \
            -e DEBEMAIL='mathieu.requillart@gmail.com' \
            -e DEBFULLNAME='Mathieu Réquillart' \
            -e DEB_BUILD_OPTIONS=noddebs \
            ghcr.io/${{ github.repository_owner }}/odio-framebuffer-ui-builder:${{ matrix.arch }} \
            bash -c '
              set -e
              mkdir -p /build/src
              cp -a /workspace/. /build/src/
              cd /build/src
              # The image is baked on main, so a branch can outrun it.
              if ! dpkg-checkbuilddeps 2>/dev/null; then
                echo "::warning::builder image is behind debian/control, installing build deps"
                apt-get update -qq
                apt-get build-dep -y --no-install-recommends ./
              fi
              RELEASED="$(head -1 debian/changelog | sed -E "s/^[^(]*\(([^)]*)\).*/\1/")"
              if [ "${RELEASED}" != "${VERSION}" ]; then
                # -b: a CI or prerelease version sorts below the released one.
                dch --newversion "${VERSION}" -b --distribution trixie --force-distribution \
                  "CI build of ${GITHUB_SHA}."
              fi
              dpkg-buildpackage -b -us -uc
              lintian --fail-on error /build/fbrowser-kiosk_*.deb
              cp /build/fbrowser-kiosk_*.deb /workspace/dist/
            '
          ls -lh dist/

      - name: Extract the binary for inspection
        run: dpkg-deb -x dist/fbrowser-kiosk_*_${{ matrix.arch }}.deb extract/

      - name: Check binary
        uses: b0bbywan/odio-ci/actions/check-binary@v1.0.3
        with:
          binary: extract/usr/bin/fbrowser-kiosk
          arch: ${{ matrix.arch }}
          # Built on trixie, and Depends pins trixie's Qt anyway: the package
          # targets trixie / Pi OS trixie, not bookworm.
          glibc_max: '2.41'

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: fbrowser-kiosk-${{ matrix.arch }}-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 7

  # `needs: build` waits for the whole matrix, so the release is published once
  # with every arch — which immutable releases also require.
  release:
    name: Release and reindex
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    uses: b0bbywan/odio-ci/.github/workflows/release.yml@v1.0.3
    with:
      artifact_pattern: fbrowser-kiosk-*-deb
    secrets:
      apt_repo_token: ${{ secrets.APT_REPO_TOKEN }}
